name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Test FastMCP Python Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekendwiz/requirements.txt
          pip install pytest

      - name: Run Senior QA Test Suite
        run: |
          python qa_test_suite.py

      - name: Run Pytest Suite
        run: |
          pytest tests/

  build-frontend:
    name: Build Next.js ChatDeck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chatdeck/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./chatdeck
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./chatdeck
        run: npm run build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'demo_key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'demo_key' }}
