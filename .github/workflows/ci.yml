name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-backend:
    name: Validate Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r weekendwiz/requirements.txt

      - name: Validate Python Syntax (server.py, agent.py, run.py)
        run: |
          python -m py_compile weekendwiz/server.py
          python -m py_compile weekendwiz/agent.py
          python -m py_compile weekendwiz/run.py
          python -m py_compile weekendwiz/agent_fun.py
          python -m py_compile qa_test_suite.py
          python -m py_compile tests/test_mcp_suite.py
          echo "All Python files compiled successfully."

      - name: Validate Package Imports
        run: |
          cd weekendwiz
          python -c "import server; print(f'FastMCP Server loaded: {len([m for m in dir(server) if not m.startswith(\"_\")])} exports')"
          python -c "import server; tools = [n for n in dir(server) if callable(getattr(server, n)) and not n.startswith('_')]; print(f'Callable tools: {len(tools)}')"

  build-frontend:
    name: Build Next.js ChatDeck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: chatdeck/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./chatdeck
        run: npm ci

      - name: Build Next.js Application
        working-directory: ./chatdeck
        run: npm run build
        env:
          GROQ_API_KEY: placeholder_for_ci_build
          GEMINI_API_KEY: placeholder_for_ci_build
